name: workbench

services:
  postgres:
    image: postgres:16-alpine
    container_name: stage-one-postgres
    environment:
      POSTGRES_DB: stage_one
      POSTGRES_USER: stage_one
      POSTGRES_PASSWORD: stage_one
    ports:
      - "11118:5432"
    volumes:
      - stage_one_postgres_data:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stage_one -d stage_one"]
      interval: 5s
      timeout: 5s
      retries: 12

  workbench:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      CORS_ALLOW_ORIGINS: http://210.117.143.172:7634,http://localhost:7634,http://127.0.0.1:7634
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_REFRESH_TOKEN_SECRET: ${AUTH_REFRESH_TOKEN_SECRET}
      DATABASE_URL: postgres://stage_one:stage_one@postgres:5432/stage_one
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: stage_one
      PGUSER: stage_one
      PGPASSWORD: stage_one
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: stage_one
      DB_USER: stage_one
      DB_PASSWORD: stage_one
      DB_SSL: "false"
      STORE_BACKEND: postgres
      COLLECTION_LLM_PLANNER_ENABLED: ${COLLECTION_LLM_PLANNER_ENABLED:-false}
      COLLECTION_ENFORCE_LLM_PLANNER: ${COLLECTION_ENFORCE_LLM_PLANNER:-false}
      COLLECTION_MEDICAL_MODE: ${COLLECTION_MEDICAL_MODE:-false}
      MEDICAL_GATE_ENABLED: ${MEDICAL_GATE_ENABLED:-true}
      MEDICAL_MIN_SIGNAL_MATCH: ${MEDICAL_MIN_SIGNAL_MATCH:-2}
      MEDICAL_MIN_DOMAIN_SCORE: ${MEDICAL_MIN_DOMAIN_SCORE:-0.35}
      NON_MEDICAL_PENALTY_ENABLED: ${NON_MEDICAL_PENALTY_ENABLED:-true}
      NON_MEDICAL_PENALTY_WEIGHT: ${NON_MEDICAL_PENALTY_WEIGHT:--8.0}
      NON_MEDICAL_STRICT_EXCLUDE: ${NON_MEDICAL_STRICT_EXCLUDE:-true}
      NON_MEDICAL_STRICT_TERMS: ${NON_MEDICAL_STRICT_TERMS:-stock,ohlcv,fraud,authorship,essay,stylometry,predictive maintenance}
      WEIGHT_MEDICAL_SIGNAL: ${WEIGHT_MEDICAL_SIGNAL:-4.0}
      WEIGHT_DOMAIN_MATCH: ${WEIGHT_DOMAIN_MATCH:-5.0}
      WEIGHT_KEYWORD_MATCH: ${WEIGHT_KEYWORD_MATCH:-1.0}
      WEIGHT_TASK_MODALITY_MATCH: ${WEIGHT_TASK_MODALITY_MATCH:-2.0}
      WEIGHT_METADATA_COMPLETENESS: ${WEIGHT_METADATA_COMPLETENESS:-1.0}
      WEIGHT_BROWSER_PENALTY: ${WEIGHT_BROWSER_PENALTY:--2.0}
      WEIGHT_SOURCE_MEDICAL_TRUST: ${WEIGHT_SOURCE_MEDICAL_TRUST:-3.0}
      WEIGHT_SOURCE_GENERIC: ${WEIGHT_SOURCE_GENERIC:-0.5}
      WEIGHT_SOURCE_NON_MEDICAL: ${WEIGHT_SOURCE_NON_MEDICAL:--3.0}
      COLLECTION_LLM_PROVIDER: ${COLLECTION_LLM_PROVIDER:-rule-based}
      COLLECTION_LLM_API_KEY: ${COLLECTION_LLM_API_KEY:-}
      COLLECTION_LLM_BASE_URL: ${COLLECTION_LLM_BASE_URL:-}
      COLLECTION_LLM_MODEL: ${COLLECTION_LLM_MODEL:-}
      COLLECTION_LLM_API_MODE: ${COLLECTION_LLM_API_MODE:-}
      COLLECTION_LLM_TIMEOUT_MS: ${COLLECTION_LLM_TIMEOUT_MS:-15000}
    ports:
      - "11119:8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  stage_one_postgres_data:
